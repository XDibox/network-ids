name: BRUTE FORCE
severity: HIGH
threshold:
  connection_count: 10  # SYN attempts per port within time_window
  time_window: 30       # seconds

# Monitored ports — port number: service label
ports:
  # Remote access
  22: SSH
  23: Telnet
  3389: RDP
  5900: VNC
  # File transfer
  21: FTP
  # Mail services
  25: SMTP
  587: SMTP-Submission
  110: POP3
  995: POP3S
  143: IMAP
  993: IMAPS
  # Databases
  3306: MySQL
  5432: PostgreSQL
  1433: MSSQL
  6379: Redis
  # Web
  8080: HTTP-Alt
