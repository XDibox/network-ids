# TCP flag-based scan detection
# flags: decimal value of the TCP flags bitmask
#   FIN=1  SYN=2  RST=4  PSH=8  ACK=16  URG=32  ECE=64  CWR=128

- name: NULL SCAN
  flags: 0
  severity: MEDIUM
  description: "TCP packet with no flags"

- name: XMAS SCAN
  flags: 41          # FIN(1) + PSH(8) + URG(32)
  severity: MEDIUM
  description: "FIN+PSH+URG flags set"

- name: FIN SCAN
  flags: 1
  severity: LOW
  description: "Only FIN flag set"
